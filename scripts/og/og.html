<!doctype html>

<style>

  .en { position: absolute; top: 340px; font-size: 28px; color: #5B6470; }
  .tags { position: absolute; top: 430px; display: flex; gap: 36px; font-size: 22px; font-weight: 600; }
  .foot { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 20px; }
